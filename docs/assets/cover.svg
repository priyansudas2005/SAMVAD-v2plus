<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.03); }
      }
      @keyframes eqBounce1 {
        0%, 100% { height: 40px; y: -20px; }
        50% { height: 75px; y: -37.5px; }
      }
      @keyframes eqBounce2 {
        0%, 100% { height: 90px; y: -45px; }
        50% { height: 130px; y: -65px; }
      }
      @keyframes eqBounce3 {
        0%, 100% { height: 120px; y: -60px; }
        50% { height: 80px; y: -40px; }
      }
      @keyframes eqBounce4 {
        0%, 100% { height: 90px; y: -45px; }
        50% { height: 124px; y: -62px; }
      }
      @keyframes eqBounce5 {
        0%, 100% { height: 70px; y: -35px; }
        50% { height: 110px; y: -55px; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.98); }
      }

      .pulse-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .rotate-ring { animation: rotateRing 25s linear infinite; transform-origin: 140px 210px; }
      .bar-1 { animation: eqBounce1 1.4s ease-in-out infinite; }
      .bar-2 { animation: eqBounce2 1.8s ease-in-out infinite; }
      .bar-3 { animation: eqBounce3 1.2s ease-in-out infinite; }
      .bar-4 { animation: eqBounce4 1.6s ease-in-out infinite; }
      .bar-5 { animation: eqBounce5 1.5s ease-in-out infinite; }
      .badge-glow { animation: badgePulse 3s ease-in-out infinite; }
    </style>

    <!-- Background Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="30%" r="75%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    
    <radialGradient id="cyanAccent" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleAccent" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Surface Gradients -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#heroGlow)" />
  <rect class="pulse-bg" width="1200" height="420" rx="16" fill="url(#cyanAccent)" />
  <rect class="pulse-bg" width="1200" height="420" rx="16" fill="url(#purpleAccent)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Geometric Grid Accent -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" />
    <path d="M 150 0 L 150 420 M 300 0 L 300 420 M 450 0 L 450 420 M 600 0 L 600 420 M 750 0 L 750 420 M 900 0 L 900 420 M 1050 0 L 1050 420" />
  </g>

  <!-- Left Side: Animated 3D Metallic Emblem Badge -->
  <g transform="translate(140, 210)">
    <!-- Shadow & Ambient Glow -->
    <circle cx="0" cy="0" r="110" fill="#000000" opacity="0.5" filter="url(#glow)" />
    <circle class="pulse-bg" cx="0" cy="0" r="95" fill="url(#badgeGrad)" opacity="0.3" filter="url(#glow)" />

    <!-- Machined Metal Outer Ring -->
    <circle cx="0" cy="0" r="90" fill="url(#metalRing)" />
    <circle cx="0" cy="0" r="82" fill="#020617" />

    <!-- Inner Metallic Bevel -->
    <circle cx="0" cy="0" r="74" fill="url(#metalRing)" opacity="0.6" />
    <circle cx="0" cy="0" r="68" fill="#0F172A" />

    <!-- Animated Soundwave EQ Bars -->
    <rect class="bar-1" x="-48" y="-20" width="8" height="40" rx="4" fill="url(#barGrad)" />
    <rect class="bar-2" x="-32" y="-45" width="8" height="90" rx="4" fill="url(#barGrad)" />
    <rect class="bar-3" x="-16" y="-60" width="8" height="120" rx="4" fill="url(#barGrad)" />
    <rect class="bar-4" x="0" y="-62" width="10" height="124" rx="5" fill="url(#barGrad)" filter="url(#glow)" />
    <rect class="bar-3" x="14" y="-55" width="8" height="110" rx="4" fill="url(#barGrad)" />
    <rect class="bar-5" x="30" y="-35" width="8" height="70" rx="4" fill="url(#barGrad)" />
    <rect class="bar-1" x="44" y="-18" width="8" height="36" rx="4" fill="url(#barGrad)" />
  </g>

  <!-- Right Side: Content & Typography -->
  <g transform="translate(340, 110)">
    <!-- Pill Badge -->
    <rect class="badge-glow" x="0" y="0" width="230" height="32" rx="16" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#22D3EE" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#A5F3FC" letter-spacing="1">LOCAL &amp; PRIVATE AI</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">SAMVAD v2.0</text>
    
    <!-- Subtitle -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#38BDF8" letter-spacing="0">Secure Offline AI Meeting Intelligence Platform</text>

    <!-- Description -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8" width="700">
      <tspan x="0" dy="0">High-performance meeting assistant with local Faster-Whisper ASR, SpeechBrain</tspan>
      <tspan x="0" dy="24">diarization, executive memo generation, and RAG Q&amp;A—100% offline.</tspan>
    </text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">⚡ Faster-Whisper ASR</text>

      <!-- Pill 2 -->
      <rect x="177" y="0" width="175" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="191" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🗣️ SpeechBrain Diarization</text>

      <!-- Pill 3 -->
      <rect x="364" y="0" width="145" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="378" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🔮 Local RAG Q&amp;A</text>

      <!-- Pill 4 -->
      <rect x="521" y="0" width="140" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="535" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🔒 100% Private</text>
    </g>
  </g>
</svg>
