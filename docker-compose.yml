###############################################################################
# SAMVAD v2.0 — Docker Compose (Production)
#
# Usage:
#   cp .env.example .env       # Create your local env file (once)
#   docker compose up --build  # Build images and start all services
#   docker compose up -d       # Start in detached mode (after first build)
#   docker compose logs -f     # Stream logs
#
# Access: http://localhost:3000
###############################################################################

services:

  # ── Backend (FastAPI + Uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: samvad-backend:2.0
    container_name: samvad-backend
    restart: unless-stopped

    # Environment: runtime-tunable variables only.
    # Path/cache variables (PYTHONPATH, HF_HOME, etc.) are set authoritatively
    # in Dockerfile.backend ENV and should NOT be duplicated here.
    env_file:
      - .env
    environment:
      # Thread caps for PyTorch CPU — must be set before torch is imported
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      VECLIB_MAXIMUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"

    # Persistent data volumes — survive container rebuilds and image upgrades.
    volumes:
      - samvad-db:/app/data/database
      - samvad-recordings:/app/data/recordings
      - samvad-models:/app/models
      - samvad-logs:/app/logs

    # Backend is NOT exposed on the host — all external traffic routes through
    # the Nginx frontend proxy. Avoids accidental direct API access.
    expose:
      - "8000"

    networks:
      - samvad-net

    # Security Hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Resource limits to prevent host CPU/Memory exhaustion during heavy ML tasks
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          memory: 1024M

    # Health check is defined in Dockerfile.backend.
    # depends_on in the frontend service gates on this condition.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend (Nginx serving Vite SPA + reverse proxy) ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: samvad-frontend:2.0
    container_name: samvad-frontend
    restart: unless-stopped

    # Only port exposed to the host — the single entry-point for all traffic.
    ports:
      - "${SAMVAD_PORT:-3000}:3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - samvad-net

    # Security Hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Resource limits for frontend proxy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Networks ──────────────────────────────────────────────────────────────────
# Explicit named network isolates SAMVAD services from other Docker workloads
# on the same host. Both services share this bridge network by default.
networks:
  samvad-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
# Named volumes persist all runtime data outside the container lifecycle.
# Use `docker volume ls` and `docker volume inspect samvad-*` to inspect them.
volumes:
  samvad-db:
    # SQLite database files
  samvad-recordings:
    # Uploaded and processed audio recordings
  samvad-models:
    # Whisper / diarization model weights (downloaded on first run)
  samvad-logs:
    # Application log files

