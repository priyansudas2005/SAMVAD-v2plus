# SAMVAD v2.0 — Nginx production configuration
# Served by the samvad-frontend Docker container on port 3000.

# Enable gzip compression for all text-based assets.
gzip on;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript
           application/wasm;
gzip_min_length 1024;
gzip_vary on;

server {
    listen 3000;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(self), microphone=*" always;
    add_header X-XSS-Protection        "1; mode=block" always;

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    # React Router: all paths fall back to index.html for client-side routing.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Long cache for hashed assets, no-cache for index.html itself.
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location /api {
        proxy_pass              http://backend:8000;
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_read_timeout      600s;
        proxy_connect_timeout   10s;
        client_max_body_size    500m;   # Allow large audio file uploads
    }

    # ── WebSocket proxy (live audio VU meter) ─────────────────────────────────
    location /ws {
        proxy_pass              http://backend:8000;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade     $http_upgrade;
        proxy_set_header        Connection  "upgrade";
        proxy_set_header        Host        $host;
        proxy_read_timeout      86400s;
    }

    # ── Static files proxy (served by FastAPI /static mount) ─────────────────
    location /static {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host $host;
        expires             7d;
        add_header          Cache-Control "public";
    }
}
