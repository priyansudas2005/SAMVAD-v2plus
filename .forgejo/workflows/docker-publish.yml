name: Publish to Docker Hub

# Manual fallback publisher. Publishing is primarily owned by the GitHub
# Actions workflow (.github/workflows/docker-publish.yml) which fires on a
# published GitHub Release. Run this workflow by hand from the Forgejo
# Actions tab only if GitHub CD is unavailable. It does NOT fire on tag
# pushes to avoid publishing the same tag from two places simultaneously.
#
# Requires repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. 2.0.1)"
        required: false
        default: latest

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/samvad
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements-ci.txt'

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run test suite
        run: pytest tests/test_api.py -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ env.IMAGE_TAG }}
