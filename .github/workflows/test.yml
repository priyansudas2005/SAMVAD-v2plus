name: Tests

# Runs the full automated suite on every push and pull request.
# Binds to the upgraded SAMVAD V2.0 REST backend and React frontend compilation.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements-ci.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install black flake8 bandit

      - name: Code Lint (flake8)
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code Formatting Check (black)
        run: black --check src

      - name: Security Scan (bandit)
        run: bandit -r src -ll -x tests

      - name: Run test suite
        run: pytest tests/test_api.py -v

  js-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Verify compilation build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-frontend
          path: frontend/dist/
          retention-days: 7
